version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ride_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: ride_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ride_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # The backend container will be added here later once the server is fully initialized

volumes:
  pgdata:
  redisdata: